<!DOCTYPE html>
<html lang="en">
<head>
    {% include "../base/base.html" %}
    {% comment %} <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous"> {% endcomment %}
    <title>Chatbot</title>
    <style>
        /* Estilos básicos para o chatbot */
        .chat-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .chat-box {
            border: 1px solid #ccc;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
            background-color: #f9f9f9;
        }
        .user-message {
            text-align: right;
            color: blue;
        }
        .bot-message {
            text-align: left;
            color: green;
        }
    </style>
</head>
<body>
    {% include "../base/navbar.html" %}
    <div class="chat-container">
        <div id="chat-box" class="chat-box">
            <div class="bot-message"><strong>Hecate:</strong> Olá, em que posso lhe ajudar hoje?</div>
        </div>
        <input type="text" id="user-input" placeholder="Digite sua mensagem...">
        <button onclick="sendMessage()">Enviar</button>
    </div>
    <script>
        function sendMessage() {
            const userInput = document.getElementById('user-input').value;
            const chatBox = document.getElementById('chat-box');

            // Exibir a mensagem do usuário
            chatBox.innerHTML += `<div class="user-message"><strong>Você:</strong> ${userInput}</div>`;

            // Enviar a mensagem para o servidor Django
            fetch('/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                    'X-CSRFToken': '{{ csrf_token }}',
                },
                body: `user_input=${encodeURIComponent(userInput)}`
            })
            .then(response => response.json())
            .then(data => {
                // Exibir a resposta do chatbot
                chatBox.innerHTML += `<div class="bot-message"><strong>Chatbot:</strong> ${data.response}</div>`;
                document.getElementById('user-input').value = '';
            })
            .catch(error => console.error('Error:', error));
        }
    </script>
    <!-- jQuery and Bootstrap JS -->
    {% comment %} <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script> {% endcomment %}

</body>
</html>
</body>
</html>
